<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="zjkl — high-school student, self-taught · Cloudflare edge services and local AI orchestration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="52%" stop-color="#121E36"/>
      <stop offset="100%" stop-color="#1C2B4C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC27A"/>
      <stop offset="100%" stop-color="#F6821F"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.46"/>
      <stop offset="48%" stop-color="#7C6BF0" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F6821F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#FFFFFF" fill-opacity="0.12"/>
    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>
  <rect width="900" height="260" fill="url(#dots)"/>
  <circle cx="170" cy="24" r="190" fill="url(#glowCool)"/>
  <circle cx="772" cy="62" r="182" fill="url(#glowWarm)"/>

  <!-- 底部双层波浪 -->
  <path d="M0,204 C120,176 210,234 330,212 C450,190 540,148 660,176 C760,199 830,222 900,202 L900,260 L0,260 Z" fill="url(#waveB)"/>
  <path d="M0,220 C130,198 220,248 350,228 C470,209 570,180 690,202 C790,221 850,236 900,222 L900,260 L0,260 Z" fill="url(#waveA)"/>

  <!-- 左侧强调竖条 -->
  <rect x="56" y="80" width="5" height="92" rx="2.5" fill="url(#accent)"/>

  <!-- 文字 -->
  <text x="80" y="118" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">zjkl</text>
  <text x="81" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#F6821F" letter-spacing="0.3">High-school student · self-taught</text>
  <text x="81" y="180" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9FB3D1" letter-spacing="0.2">Cloudflare edge services · local AI orchestration</text>

  <!-- 右侧胶囊 -->
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13">
    <rect x="620" y="94" width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="705" y="114" text-anchor="middle" fill="#CBD5E1">since 2024</text>
    <rect x="620" y="134" width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="705" y="154" text-anchor="middle" fill="#CBD5E1">Ji'an, Jiangxi, China</text>
  </g>
</svg>
